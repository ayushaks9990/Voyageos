services:
  - type: web
    name: voyageos-ai
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ENABLE_PUBLIC_ENRICHMENT
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
